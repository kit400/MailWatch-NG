name: PHPUnit

on:
  push:
    branches: [ "main", "1.2" ]
    paths-ignore:
      - '**/*.md'
      - 'data/**'
      - 'MailScanner_perl_scripts/**'
      - 'tools/MailScanner_config/**'
      - 'tools/sudo/**'
  pull_request:
    branches: [ "main", "1.2" ]
    paths-ignore:
      - '**/*.md'
      - 'data/**'
      - 'MailScanner_perl_scripts/**'
      - 'tools/MailScanner_config/**'
      - 'tools/sudo/**'
  workflow_dispatch:

jobs:
  test:
    name: "PHP: ${{ matrix.php-version }} | PHPUnit"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Run tests
        run: ./vendor/bin/phpunit
