# MailWatch Web Application Security Configuration for Apache HTTP Server
# Disallows direct web access to internal runtime, temp, and library directories (MW-05)

<Directory "/var/www/html/mailscanner/temp">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/mailscanner/lib">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/mailscanner/tools">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/mailscanner">
    Options -Indexes -FollowSymLinks
    <FilesMatch "\.(inc\.php|cache|json|mmdb|log|conf|bak|dist|sh|sql)$">
        Require all denied
    </FilesMatch>
</Directory>
